[package]
name = "auuremote"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
getrandom = "0.3"
ironrdp = { version = "0.17", features = ["cliprdr", "connector", "graphics", "input", "session"] }
ironrdp-tls = { version = "0.3", features = ["rustls-ring"] }
ironrdp-tokio = { version = "0.10", features = ["reqwest"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "~2.12.0", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
ironrdp-cliprdr-native = "0.7"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
async-trait = "0.1"
ironrdp-server = { version = "0.13", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
